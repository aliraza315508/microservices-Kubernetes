apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-exchange
  namespace: default
  labels:
    app: currency-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currency-exchange
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: currency-exchange
    spec:
      containers:
        - name: mmv2-currency-exchange-service
          image: in28min/mmv3-currency-exchange-service:0.0.11-SNAPSHOT
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              port: 8000
              path: /actuator/health/readiness
          livenessProbe:
            httpGet:
              port: 8000
              path: /actuator/health/liveness
      restartPolicy: Always
